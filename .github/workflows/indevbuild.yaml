name: Indev build

on:
  push:
    branches: [ "indev" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: indev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@11d4d83c63a6ce61b32d8a9c4faddbdb04fe9917 # v6

    - name: Compute version
      run: |
        BASE=$(grep '^mod_version' gradle.properties | cut -d= -f2 | sed -E 's/[^0-9.].*//')
        echo "VERSION=$BASE-indev.${{ github.run_number }}" >> "$GITHUB_ENV"

    - name: Build
      run: ./gradlew build -Pmod_version="$VERSION"

    - name: Publish release
      run: |
        gh release create "$VERSION" build/libs/*.jar \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "$VERSION" \
          --notes "Automatic build of indev at ${GITHUB_SHA::7}. Unstable, back up your worlds."

    - name: Prune old releases
      run: |
        gh release delete indev-latest --cleanup-tag --yes || true
        gh release list --limit 100 --json tagName --jq '.[].tagName | select(contains("-indev."))' \
          | tail -n +11 \
          | xargs -r -n1 gh release delete --cleanup-tag --yes
